
<!DOCTYPE html>
<html>
<head>
    <title>Counter App</title>
</head>

<body>

    <h1>Counter App</h1>

    <h3 id="number">0</h3>

    <button onclick="increase()">Increase</button>
    <button onclick="decrease()">Decrease</button>
    <button onclick="reset()">Reset</button>

    <script>
        let count = 0;

        function increase() {
            count++;
            document.getElementById("number").innerText = count;
        }

        function decrease() {
            count--;
            document.getElementById("number").innerText = count;
        }

        function reset() {
            count = 0;
            document.getElementById("number").innerText = count;
        }
    </script>

</body>
</html>
